var q=document.getElementById('q'),out=document.getElementById('out'),msg=document.getElementById('msg'),scn=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s).toLowerCase()}
function render(list,total){
  out.innerHTML=list.map(function(p){var tot=p.l.reduce(function(a,x){return a+x[1]},0);
    var cls=tot<=0?' ag':(tot<=TH?' lo':''),bd=tot<=0?'<span class="bg">AGOTADO</span>':(tot<=TH?'<span class="bg">⚠ STOCK BAJO</span>':'');return '<div class="c'+cls+'"><div class="k">'+esc(p.c)+bd+'</div><div class="d">'+esc(p.d)+'</div><div class="t">Stock total: '+tot+' · '+p.l.length+(p.l.length==1?' ubicación':' ubicaciones')+'</div>'+
    p.l.map(function(x){return '<div class="l"><span>'+esc(x[0])+'</span><b>'+x[1]+' u.</b></div>'}).join('')+'</div>'}).join('');
  msg.className='m';msg.textContent=total==0?'Sin coincidencias.':(total>list.length?'Mostrando '+list.length+' de '+total+': agrega más palabras para afinar.':total+(total==1?' producto encontrado.':' productos encontrados.'));
}
var PA=[['PDD','Puerta delantera derecha'],['PDI','Puerta delantera izquierda'],['PTD','Puerta trasera derecha'],['PTI','Puerta trasera izquierda'],['ADD','Aleta delantera derecha'],['ADI','Aleta delantera izquierda'],['ATD','Aleta trasera derecha'],['ATI','Aleta trasera izquierda'],['LUN','Luneta'],['LUND','Luneta derecha'],['LUNI','Luneta izquierda'],['LTD','Lateral trasero derecho'],['LTI','Lateral trasero izquierdo'],['PBS','Parabrisas'],['PBSD','Parabrisas derecho'],['PBSI','Parabrisas izquierdo']];
var EXTRA=(function(){var k={},s={},o=[];PA.forEach(function(g){k[g[0]]=1});DATA.forEach(function(p){var c=p.d.split(' ')[0];if(!k[c]&&!s[c]){s[c]=1;o.push([c,'Otros'])}});return o.sort()})();
function item(p){var tot=p.l.reduce(function(a,x){return a+x[1]},0),cls=tot<=0?' ag':(tot<=TH?' lo':''),bd=tot<=0?'<span class="bg">AGOTADO</span>':(tot<=TH?'<span class="bg">\u26a0 STOCK BAJO</span>':'');return '<div class="c'+cls+'"><div class="k">'+esc(p.c)+bd+'</div><div class="d">'+esc(p.d)+'</div><div class="t">Stock total: '+tot+'</div><details><summary class="m">Ver ubicaciones ('+p.l.length+')</summary>'+p.l.map(function(x){return '<div class="l"><span>'+esc(x[0])+'</span><b>'+x[1]+' u.</b></div>'}).join('')+'</details></div>'}
function pa(){
  window.LAST=pa;var v=document.getElementById('mq').value.trim();
  if(!v){out.innerHTML='';msg.className='m';msg.textContent='Escribe un modelo, ej: forester o hyundai tucson.';return}
  var ws=norm(v).split(/\s+/),n=0,h='';
  PA.concat(EXTRA).forEach(function(g){
    var r=DATA.filter(function(p){var t=norm(p.c+' '+p.d);return norm(p.d).split(' ')[0]===g[0].toLowerCase()&&ws.every(function(w){return t.indexOf(w)>=0})}).sort(function(a,b){return a.d<b.d?-1:1});
    if(!r.length)return;n+=r.length;
    h+='<div class="gh">'+g[1]+' ('+g[0]+') \u00b7 '+r.length+'</div>'+r.map(item).join('');
  });
  out.innerHTML=h;msg.className='m';
  msg.textContent=n?n+(n==1?' pieza encontrada.':' piezas encontradas.'):'Sin piezas para ese modelo. Prueba con menos palabras.';
}
function search(){window.LAST=null;
  var v=q.value.trim();if(!v){out.innerHTML='';msg.textContent='';return}
  var vl=v.toLowerCase(),tk=vl.split(/[^a-z0-9]+/).filter(Boolean),tk2=tk.map(function(t){return t.replace(/^0+(?=\d)/,'')});
  var ex=DATA.filter(function(p){var c=String(p.c).toLowerCase();return c===vl||tk.indexOf(c)>=0||tk2.indexOf(c)>=0});
  if(!ex.length&&/^\d{8,}$/.test(vl))ex=DATA.filter(function(p){var c=String(p.c);return /^\d{6,}$/.test(c)&&vl.indexOf(c)>=0});
  if(ex.length){render(ex,ex.length);return}
  var ws=norm(v).split(/\s+/);
  var r=DATA.filter(function(p){var t=norm(p.c+' '+p.d);return ws.every(function(w){return t.indexOf(w)>=0})});
  render(r.slice(0,30),r.length);
}
function stop(){document.getElementById('cam').style.display='none';if(scn){var s=scn;scn=null;s.stop().then(function(){s.clear()}).catch(function(){})}}
function scan(){
  if(typeof Html5Qrcode==='undefined'){msg.className='m e';msg.textContent='No se pudo cargar el lector de cámara. Escribe el código a mano.';return}
  document.getElementById('cam').style.display='block';
  var F=Html5QrcodeSupportedFormats;
  scn=new Html5Qrcode('rd',{formatsToSupport:[F.CODE_128,F.CODE_39,F.EAN_13,F.EAN_8,F.UPC_A,F.ITF,F.CODE_93,F.QR_CODE],useBarCodeDetectorIfSupported:true,verbose:false});
  scn.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},function(t){q.value=t.trim();stop();search()},function(){})
   .catch(function(){stop();msg.className='m e';msg.textContent='No se pudo abrir la cámara (permiso denegado o bloqueado). Puedes usar un lector Bluetooth o escribir el código.'});
}

document.getElementById('sc').onclick=scan;
document.getElementById('st').onclick=stop;
